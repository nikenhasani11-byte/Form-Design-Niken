 <nav

        <a class="navbar-brand fw-bold" href="#">Nikreative Studio </a>

<!-- contact section -->
    <div id="kontak" class="bg-light py-5"
    style="background-color: #fad6d3 !important">
      <div class="container">
        <h2 class="text-center mb-4">Konfirmasi</h2>
        <form
          class="mx-auto bg-white p-4 rounded shadow-sm"
          style="max-width: 500px"
        >
          <!-- input nama -->
          <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label"
              >Nama Lengkap</label
            >
            <input
              type="text"
              class="form-control"
              id="input-nama"
              placeholder="Masukkan nama disini"
            />
          </div>

            <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label"
              >No Telepon</label
            >
            <input
              type="text"
              class="form-control"
              id="input-nama"
              placeholder="Masukkan no telepon mu"
            />
          </div>

          <!-- input pesan -->
          <div class="mb-3">
            <label for="exampleFormControlTextarea1" class="form-label"
              >Pesan</label
            >
            <textarea
              class="form-control"
              id="exampleFormControlTextarea1"
              rows="3"
              placeholder="Contoh: design saya berupa Design Poster Hari Kemerdekaan Indonesia"
            ></textarea>
          </div>

        <!-- Tombol Submit -->
        <button type="button" class="btn btn-primary w-100" onclick="sukses()">Konfirmasi</button>
            </form>
        </div>
      </div>
      </div>
    </div>

         <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
     <script>
        function sukses() {
            Swal.fire({
            title: "Pesanan Anda telah terkonfirmasi, tunggu pesan dari kami!",
            icon: "success",
            draggable: true
            });
        }
     </script>
